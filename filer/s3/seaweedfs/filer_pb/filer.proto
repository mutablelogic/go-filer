// The parts of SeaweedFS's filer.proto, from
// https://github.com/seaweedfs/seaweedfs/blob/master/weed/pb/filer.proto,
// which subscribe to the changes to the metadata of a filer, such as those
// of an S3 bucket, which is a directory of the filer. The package, service,
// messages and fields have their names and numbers, so they're compatible,
// but those which aren't needed are left out, which are ignored when they're
// received.
syntax = "proto3";

package filer_pb;

option go_package = "github.com/mutablelogic/go-filer/filer/s3/seaweedfs/filer_pb";

service SeaweedFiler {
    rpc GetFilerConfiguration (GetFilerConfigurationRequest) returns (GetFilerConfigurationResponse) {
    }

    rpc SubscribeMetadata (SubscribeMetadataRequest) returns (stream SubscribeMetadataResponse) {
    }
}

message GetFilerConfigurationRequest {
}

message GetFilerConfigurationResponse {
    string dir_buckets = 5;
    string version = 11;
}

message SubscribeMetadataRequest {
    string client_name = 1;
    string path_prefix = 2;
    int64 since_ns = 3;
    int32 client_id = 7;
    int32 client_epoch = 9;
}

message SubscribeMetadataResponse {
    string directory = 1;
    EventNotification event_notification = 2;
    int64 ts_ns = 3;
}

message EventNotification {
    Entry old_entry = 1;
    Entry new_entry = 2;
    string new_parent_path = 4;
}

message Entry {
    string name = 1;
    bool is_directory = 2;
    FuseAttributes attributes = 4;
    map<string, bytes> extended = 5;
}

message FuseAttributes {
    uint64 file_size = 1;
    int64 mtime = 2; // unix time in seconds
    string mime = 7;
    bytes md5 = 14;
    int32 mtime_ns = 19; // nanosecond component of mtime (0-999999999)
}
