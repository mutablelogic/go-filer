<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>filer</title>
    <link rel="stylesheet" href="index.css">
    <script type="module" src="index.js"></script>
    <style>
        body {
            margin: 0;
            background: var(--cds-background);
            color: var(--cds-text-primary);
            font-family: 'IBM Plex Sans', sans-serif;
        }

        /* The header is 3rem high, and the side navigation 16rem wide, when
           it's fixed open, on large screens */
        main {
            padding: calc(3rem + 2rem) 2rem 2rem;
        }

        /* A page's header is across the page, beneath the menu bar */
        main gs-page-header {
            --gs-page-header-margin: -2rem -2rem 1.5rem;
        }

        /* The router hides the pages which aren't shown, which Carbon's
           styles would show */
        main > section[hidden] {
            display: none;
        }

        /* The server's status is at the bottom of the side navigation, and
           its items scroll above it */
        cds-side-nav-items {
            margin-bottom: calc(3rem + 1px);
        }




        gs-server-status {
            position: absolute;
            right: 0;
            bottom: 0;
            left: 0;
            border-top: 1px solid var(--cds-border-subtle);
        }

        /* The Volumes page: the volumes, and their state */
        .gf-volumes {
            margin: 0;
            padding: 0;
            list-style: none;
        }

        .gf-volumes li {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem 1rem;
            padding: 0.75rem 0;
            border-bottom: 1px solid var(--cds-border-subtle);
            font-size: 0.875rem;
        }

        .gf-volumes a {
            color: var(--cds-link-primary);
            font-weight: 600;
            text-decoration: none;
        }

        .gf-volumes span {
            flex: 1 1 0;
            min-width: 0;
            color: var(--cds-text-secondary);
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        /* A volume's page fills the window, beneath its header, with the
           tree of its folders beside the objects of the folder which is
           chosen, each of which scrolls on its own, rather than the window */
        main:has(> #page-volume:not([hidden])) {
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            height: 100vh;
            height: 100dvh;
            padding-bottom: 0;
        }

        #page-volume:not([hidden]) {
            display: flex;
            flex: 1;
            flex-direction: column;
            min-height: 0;
        }

        gf-volume {
            display: flex;
            flex: 1;
            flex-direction: column;
            min-height: 0;
        }

        .gf-volume {
            display: flex;
            flex: 1;
            gap: 1.5rem;
            min-height: 0;
        }

        .gf-volume-tree {
            flex: 0 0 20rem;
            max-width: 40%;
            overflow: auto;
            padding-bottom: 2rem;
            cursor: pointer;
            user-select: none;
        }

        .gf-volume-tree[hidden] {
            display: none;
        }

        .gf-volume-view {
            display: block;
            flex: 1;
            min-width: 0;
            overflow: auto;
            padding-bottom: 2rem;
        }

        /* The file view's header stays at the top, as it's scrolled */
        .gf-file-view-table {
            width: 100%;
        }

        .gf-file-view-table thead th {
            position: sticky;
            top: 0;
            z-index: 1;
        }

        .gf-file-view-name {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
        }

        .gf-file-view-size {
            text-align: right;
            white-space: nowrap;
        }

        /* What the file view says, of a folder without objects */
        .gf-file-view-empty {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.75rem;
            padding: 4rem 1rem;
            color: var(--cds-text-secondary);
            font-size: 0.875rem;
        }

        .gf-file-view-empty svg {
            fill: var(--cds-icon-secondary);
        }

        .gf-file-view-empty p {
            margin: 0;
        }

        .gf-file-view-end {
            min-height: 2rem;
            padding-top: 0.5rem;
        }

        .gf-file-view-count {
            margin: 0;
            padding-top: 0.5rem;
            color: var(--cds-text-secondary);
            font-size: 0.75rem;
        }

        .gf-empty {
            margin: 0;
            color: var(--cds-text-secondary);
            font-size: 0.875rem;
        }

        .gf-volume-error {
            margin: 0 0 1rem;
            color: var(--cds-text-error);
            font-size: 0.875rem;
        }

        @media (min-width: 66rem) {
            main {
                margin-left: 16rem;
            }
        }
    </style>
</head>

<body class="cds--white">
    <!-- The menu bar, and the sidebar, of the navigation controller, with
         the server's status at its bottom. Each module owns an item in the
         menu bar, and the sidebar while it's active. -->
    <div class="cds--g100">
        <gs-header></gs-header>
        <gs-side-nav>
            <gs-server-status></gs-server-status>
        </gs-side-nav>
    </div>

    <!-- The modules' pages, which they add -->
    <main></main>

    <gs-notifications></gs-notifications>
</body>

</html>
