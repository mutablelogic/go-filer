<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>filer</title>
    <link rel="stylesheet" href="index.css">
    <script type="module" src="index.js"></script>
    <style>
        body {
            margin: 0;
            background: var(--cds-background);
            color: var(--cds-text-primary);
            font-family: 'IBM Plex Sans', sans-serif;
        }

        /* The header is 3rem high, and the side navigation 16rem wide, when
           it's fixed open, on large screens */
        main {
            padding: calc(3rem + 2rem) 2rem 2rem;
        }

        /* A page's header is across the page, beneath the menu bar */
        main gs-page-header {
            --gs-page-header-margin: -2rem -2rem 1.5rem;
        }

        /* The router hides the pages which aren't shown, which Carbon's
           styles would show */
        main > section[hidden] {
            display: none;
        }

        /* The server's status is at the bottom of the side navigation, and
           the player above it, while something is played, and its items
           scroll above them, of the player's height, which the app sets */
        cds-side-nav-items {
            margin-bottom: calc(3rem + 1px + var(--gf-player-height, 0px));
        }




        gs-server-status {
            position: absolute;
            right: 0;
            bottom: 0;
            left: 0;
            border-top: 1px solid var(--cds-border-subtle);
        }

        /* The Volumes page: a tile of each volume, which goes to its page */
        /* The welcome of a filer without volumes, of how to start */
        .gf-welcome {
            max-width: 48rem;
            padding: 2rem 0;
        }

        .gf-welcome h2 {
            margin: 0 0 2rem;
            font-size: 2rem;
            font-weight: 300;
        }

        .gf-welcome ul {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
            margin: 0;
            padding: 0;
            list-style: none;
        }

        .gf-welcome li {
            display: flex;
            gap: 1rem;
            align-items: flex-start;
        }

        .gf-welcome li svg {
            flex: none;
            fill: var(--cds-icon-secondary, #525252);
        }

        .gf-welcome h3 {
            margin: 0 0 0.25rem;
            font-size: 1rem;
            font-weight: 600;
        }

        .gf-welcome p {
            margin: 0;
            color: var(--cds-text-secondary, #525252);
            font-size: 0.875rem;
            line-height: 1.4;
        }

        .gf-welcome code {
            font-family: 'IBM Plex Mono', monospace;
            font-size: 0.8125rem;
        }

        .gf-welcome a {
            color: var(--cds-link-primary, #0f62fe);
        }

        .gf-volume-tiles {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(15rem, 1fr));
            gap: 1rem;
        }

        /* A tile fills its cell of the grid, as high as the highest of its
           row, so its pencil is always at its bottom right, of its link,
           which is Carbon's tile, too */
        .gf-volume-tile-wrap {
            position: relative;
            display: flex;
            flex-direction: column;
            min-width: 0;
        }

        .gf-volume-tile {
            display: block;
            flex: 1;
            min-width: 0;
        }

        .gf-volume-tile::part(link) {
            box-sizing: border-box;
            height: 100%;
        }

        /* The button which edits a volume, at its tile's bottom right */
        .gf-volume-tile-edit {
            position: absolute;
            right: 0.5rem;
            bottom: 0.5rem;
        }

        /* The form of a volume's options, in its panel */
        .gf-volume-form {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        .gf-volume-form-field .cds--label {
            margin-bottom: 0.5rem;
        }

        /* What the choice of a field is, beneath it, as Carbon's helper text */
        .gf-volume-form-helper {
            margin: 0.25rem 0 0;
            color: var(--cds-text-helper);
            font-size: 0.75rem;
            line-height: 1rem;
        }

        /* A volume's details, in its panel's View tab */
        .gf-volume-details {
            display: grid;
            grid-template-columns: max-content 1fr;
            gap: 0.75rem 1.5rem;
            margin: 0;
            font-size: 0.875rem;
        }

        .gf-volume-details dt {
            color: var(--cds-text-secondary);
        }

        .gf-volume-details dd {
            margin: 0;
            min-width: 0;
            overflow-wrap: anywhere;
        }

        /* A namespace of a file's metadata, in its panel */
        .gf-object-namespace {
            margin: 1.5rem 0 0.75rem;
            padding-top: 1rem;
            border-top: 1px solid var(--cds-border-subtle-01, #e0e0e0);
            color: var(--cds-text-secondary);
            font-size: 0.75rem;
            font-weight: 600;
            letter-spacing: 0.32px;
            text-transform: uppercase;
        }

        .gf-volume-view-note {
            margin: 1.5rem 0 0;
            color: var(--cds-text-secondary);
            font-size: 0.875rem;
        }

        .gf-volume-form[hidden],
        gf-volume-form[hidden] {
            display: none;
        }


        .gf-volume-tile cds-tag {
            margin: 0 0 0.75rem;
        }

        .gf-volume-tile-label {
            margin: 0;
            font-size: 1rem;
            font-weight: 600;
            line-height: 1.375rem;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .gf-volume-tile-name {
            margin: 0 0 1rem;
            color: var(--cds-text-secondary);
            font-size: 0.75rem;
        }

        .gf-volume-tile-count,
        .gf-volume-tile-state {
            margin: 0;
            color: var(--cds-text-secondary);
            font-size: 0.875rem;
        }

        .gf-volume-tile-count strong {
            display: block;
            color: var(--cds-text-primary);
            font-size: 1.75rem;
            font-weight: 300;
            line-height: 2.25rem;
        }

        .gf-volume-tile-error {
            color: var(--cds-text-error);
        }

        /* The volumes' stats, beneath their tiles, of the tab which is chosen */
        .gf-volume-stats {
            margin-top: 2rem;
        }

        .gf-volume-stats cds-tabs {
            margin-bottom: 1rem;
        }

        /* Each volume's section, of a faint line from the one before */
        .gf-indexing {
            display: flex;
            flex-direction: column;
        }

        .gf-indexing-volume {
            padding-block: 1.5rem;
        }

        .gf-indexing-volume + .gf-indexing-volume {
            border-top: 1px solid var(--cds-border-subtle);
        }

        .gf-indexing-volume h3 {
            margin: 0;
            font-size: 1.25rem;
            font-weight: 300;
            line-height: 1.75rem;
        }

        .gf-indexing-volume h3 a {
            color: var(--cds-text-primary);
            text-decoration: none;
        }

        .gf-indexing-volume h3 a:hover {
            text-decoration: underline;
        }

        .gf-indexing-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 0.25rem;
            margin: 0.25rem 0 0.5rem;
        }

        .gf-indexing-tags cds-tag {
            margin: 0;
        }

        .gf-meter-empty {
            margin: 0.5rem 0 0;
            color: var(--cds-text-secondary);
            font-size: 0.875rem;
        }

        /* A volume's status, beside its page's title */
        .gf-volume-header-status {
            display: flex;
            align-items: center;
            gap: 0.25rem;
            padding: 0 1rem;
        }

        .gf-volume-header-status cds-tag {
            margin: 0;
        }

        /* A volume's page fills the window, beneath its header, with the
           tree of its folders beside the objects of the folder which is
           chosen, each of which scrolls on its own, rather than the window */
        main:has(> #page-volume:not([hidden])) {
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            height: 100vh;
            height: 100dvh;
            padding-bottom: 0;
        }

        #page-volume:not([hidden]) {
            display: flex;
            flex: 1;
            flex-direction: column;
            min-height: 0;
        }

        gf-volume {
            display: flex;
            flex: 1;
            flex-direction: column;
            min-height: 0;
        }

        /* An alert spans the page, above what it's about */
        .gf-alert {
            max-inline-size: none;
            margin-block-end: 1rem;
        }

        .gf-volume {
            display: flex;
            flex: 1;
            gap: 1.5rem;
            min-height: 0;
        }

        .gf-volume-tree {
            flex: 0 0 20rem;
            max-width: 40%;
            overflow: auto;
            padding-bottom: 2rem;
            cursor: pointer;
            user-select: none;
        }

        .gf-volume-tree[hidden] {
            display: none;
        }

        .gf-volume-view {
            display: block;
            flex: 1;
            min-width: 0;
            overflow: auto;
            padding-bottom: 2rem;
        }

        /* The files which are deleted, in the panel which confirms it */
        .gf-object-delete-list {
            margin: 0;
            padding-left: 1.25rem;
            list-style: disc;
            font-size: 0.875rem;
            overflow-wrap: anywhere;
        }

        /* How many files are chosen, above those which are listed, in the
           panel which adds files, and whether a folder is being read */
        .gf-object-upload-summary {
            margin: 1rem 0 0.5rem;
            color: var(--cds-text-secondary);
            font-size: 0.875rem;
        }

        /* A file's size, beside its path, in the panel which adds files */
        .gf-object-upload-size {
            margin-left: 0.5rem;
            color: var(--cds-text-secondary);
        }

        /* A file's artwork, in its panel, as a grid of images, each as
           wide as it, of their own shapes, with what each is beneath */
        .gf-object-artwork {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(9rem, 1fr));
            gap: 1.5rem 1rem;
            margin: 0;
            padding: 0;
            list-style: none;
        }

        .gf-object-artwork li {
            display: flex;
            flex-direction: column;
            gap: 0.25rem;
            min-width: 0;
        }

        .gf-object-artwork a {
            display: block;
            outline-offset: 2px;
        }

        .gf-object-artwork img {
            display: block;
            width: 100%;
            height: auto;
            max-height: 16rem;
            object-fit: contain;
            background: var(--cds-layer-accent-01, #e0e0e0);
        }

        .gf-object-artwork-label {
            font-size: 0.875rem;
        }

        .gf-object-artwork-detail {
            color: var(--cds-text-secondary);
            font-size: 0.75rem;
            overflow-wrap: anywhere;
        }

        /* The file view is go-server's gs-table, which scrolls in the
           volume's view, so it fills its width */
        .gf-file-view-table {
            display: block;
        }

        /* Carbon's skeleton, of grey bars which are animated, of what's
           loading, a line at a time */
        .gf-skeleton cds-skeleton-text {
            display: block;
        }

        .gf-empty {
            margin: 0;
            color: var(--cds-text-secondary);
            font-size: 0.875rem;
        }

        .gf-volume-error {
            margin: 0 0 1rem;
            color: var(--cds-text-error);
            font-size: 0.875rem;
        }

        @media (min-width: 66rem) {
            main {
                margin-left: 16rem;
            }
        }
    </style>
</head>

<body class="cds--white">
    <!-- The menu bar, and the sidebar, of the navigation controller, with
         the server's status at its bottom. Each module owns an item in the
         menu bar, and the sidebar while it's active. -->
    <div class="cds--g100">
        <gs-header></gs-header>
        <gs-side-nav>
            <gs-media-player></gs-media-player>
            <gs-server-status></gs-server-status>
        </gs-side-nav>
    </div>

    <!-- The modules' pages, which they add -->
    <main></main>

    <gs-notifications></gs-notifications>
</body>

</html>
