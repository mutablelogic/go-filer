<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>filer</title>
    <link rel="stylesheet" href="index.css">
    <script type="module" src="index.js"></script>
    <style>
        body {
            margin: 0;
            background: var(--cds-background);
            color: var(--cds-text-primary);
            font-family: 'IBM Plex Sans', sans-serif;
        }

        /* The header is 3rem high, and the side navigation 16rem wide, when
           it's fixed open, on large screens */
        main {
            padding: calc(3rem + 2rem) 2rem 2rem;
        }

        /* A page's header is across the page, beneath the menu bar */
        main gs-page-header {
            --gs-page-header-margin: -2rem -2rem 1.5rem;
        }

        /* The router hides the pages which aren't shown, which Carbon's
           styles would show */
        main > section[hidden] {
            display: none;
        }

        /* The server's status is at the bottom of the side navigation, and
           its items scroll above it */
        cds-side-nav-items {
            margin-bottom: calc(3rem + 1px);
        }




        gs-server-status {
            position: absolute;
            right: 0;
            bottom: 0;
            left: 0;
            border-top: 1px solid var(--cds-border-subtle);
        }

        /* The Volumes page: a tile of each volume, which goes to its page */
        .gf-volume-tiles {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(15rem, 1fr));
            gap: 1rem;
        }

        .gf-volume-tile-wrap {
            position: relative;
            min-width: 0;
        }

        .gf-volume-tile {
            display: block;
            height: 100%;
            min-width: 0;
        }

        /* The button which edits a volume, at its tile's bottom right */
        .gf-volume-tile-edit {
            position: absolute;
            right: 0.5rem;
            bottom: 0.5rem;
        }

        /* The form of a volume's options, in its panel */
        .gf-volume-form {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        .gf-volume-form-field .cds--label {
            margin-bottom: 0.5rem;
        }

        .gf-volume-form-heading {
            margin: 0.5rem 0 -0.5rem;
            font-size: 0.875rem;
            font-weight: 600;
        }

        .gf-volume-tile cds-tag {
            margin: 0 0 0.75rem;
        }

        .gf-volume-tile-label {
            margin: 0;
            font-size: 1rem;
            font-weight: 600;
            line-height: 1.375rem;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .gf-volume-tile-name {
            margin: 0 0 1rem;
            color: var(--cds-text-secondary);
            font-size: 0.75rem;
        }

        .gf-volume-tile-count,
        .gf-volume-tile-state {
            margin: 0;
            color: var(--cds-text-secondary);
            font-size: 0.875rem;
        }

        .gf-volume-tile-count strong {
            display: block;
            color: var(--cds-text-primary);
            font-size: 1.75rem;
            font-weight: 300;
            line-height: 2.25rem;
        }

        .gf-volume-tile-error {
            color: var(--cds-text-error);
        }

        /* The volumes' stats, beneath their tiles, of the tab which is chosen */
        .gf-volume-stats {
            margin-top: 2rem;
        }

        .gf-volume-stats cds-tabs {
            margin-bottom: 1rem;
        }

        /* Each volume's section, of a faint line from the one before */
        .gf-indexing {
            display: flex;
            flex-direction: column;
        }

        .gf-indexing-volume {
            padding-block: 1.5rem;
        }

        .gf-indexing-volume + .gf-indexing-volume {
            border-top: 1px solid var(--cds-border-subtle);
        }

        .gf-indexing-volume h3 {
            margin: 0;
            font-size: 1.25rem;
            font-weight: 300;
            line-height: 1.75rem;
        }

        .gf-indexing-volume h3 a {
            color: var(--cds-text-primary);
            text-decoration: none;
        }

        .gf-indexing-volume h3 a:hover {
            text-decoration: underline;
        }

        .gf-indexing-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 0.25rem;
            margin: 0.25rem 0 0.5rem;
        }

        .gf-indexing-tags cds-tag {
            margin: 0;
        }

        .gf-meter-empty {
            margin: 0.5rem 0 0;
            color: var(--cds-text-secondary);
            font-size: 0.875rem;
        }

        /* A volume's page fills the window, beneath its header, with the
           tree of its folders beside the objects of the folder which is
           chosen, each of which scrolls on its own, rather than the window */
        main:has(> #page-volume:not([hidden])) {
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            height: 100vh;
            height: 100dvh;
            padding-bottom: 0;
        }

        #page-volume:not([hidden]) {
            display: flex;
            flex: 1;
            flex-direction: column;
            min-height: 0;
        }

        gf-volume {
            display: flex;
            flex: 1;
            flex-direction: column;
            min-height: 0;
        }

        /* An alert spans the page, above what it's about */
        .gf-alert {
            max-inline-size: none;
            margin-block-end: 1rem;
        }

        .gf-volume {
            display: flex;
            flex: 1;
            gap: 1.5rem;
            min-height: 0;
        }

        .gf-volume-tree {
            flex: 0 0 20rem;
            max-width: 40%;
            overflow: auto;
            padding-bottom: 2rem;
            cursor: pointer;
            user-select: none;
        }

        .gf-volume-tree[hidden] {
            display: none;
        }

        .gf-volume-view {
            display: block;
            flex: 1;
            min-width: 0;
            overflow: auto;
            padding-bottom: 2rem;
        }

        /* The file view's header stays at the top, as it's scrolled */
        .gf-file-view-table {
            width: 100%;
        }

        /* A row is pointed at, as it's chosen */
        .gf-file-view-table tbody tr {
            cursor: pointer;
        }

        .gf-file-view-table thead th {
            position: sticky;
            top: 0;
            z-index: 1;
        }

        .gf-file-view-name {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
        }

        .gf-file-view-type {
            max-width: 12rem;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .gf-file-view-size {
            text-align: right;
            white-space: nowrap;
        }

        /* What the file view says, of a folder without objects */
        .gf-file-view-empty {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.75rem;
            padding: 4rem 1rem;
            color: var(--cds-text-secondary);
            font-size: 0.875rem;
        }

        .gf-file-view-empty svg {
            fill: var(--cds-icon-secondary);
        }

        .gf-file-view-empty p {
            margin: 0;
        }

        .gf-file-view-failed {
            display: flex;
            align-items: center;
            gap: 1rem;
            padding-top: 0.5rem;
            color: var(--cds-text-error);
            font-size: 0.875rem;
        }

        .gf-file-view-end {
            min-height: 2rem;
            padding-top: 0.5rem;
        }

        .gf-file-view-count {
            margin: 0;
            padding-top: 0.5rem;
            color: var(--cds-text-secondary);
            font-size: 0.75rem;
        }

        .gf-empty {
            margin: 0;
            color: var(--cds-text-secondary);
            font-size: 0.875rem;
        }

        .gf-volume-error {
            margin: 0 0 1rem;
            color: var(--cds-text-error);
            font-size: 0.875rem;
        }

        @media (min-width: 66rem) {
            main {
                margin-left: 16rem;
            }
        }
    </style>
</head>

<body class="cds--white">
    <!-- The menu bar, and the sidebar, of the navigation controller, with
         the server's status at its bottom. Each module owns an item in the
         menu bar, and the sidebar while it's active. -->
    <div class="cds--g100">
        <gs-header></gs-header>
        <gs-side-nav>
            <gs-server-status></gs-server-status>
        </gs-side-nav>
    </div>

    <!-- The modules' pages, which they add -->
    <main></main>

    <gs-notifications></gs-notifications>
</body>

</html>
