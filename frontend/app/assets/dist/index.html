<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>filer</title>
    <link rel="stylesheet" href="index.css">
    <script type="module" src="index.js"></script>
    <style>
        body {
            margin: 0;
            background: var(--cds-background);
            color: var(--cds-text-primary);
            font-family: 'IBM Plex Sans', sans-serif;
        }

        /* The header is 3rem high, and the side navigation 16rem wide, when
           it's fixed open, on large screens */
        main {
            padding: calc(3rem + 2rem) 2rem 2rem;
        }

        /* A page's header is across the page, beneath the menu bar */
        main gs-page-header {
            --gs-page-header-margin: -2rem -2rem 1.5rem;
        }

        /* The router hides the pages which aren't shown, which Carbon's
           styles would show */
        main > section[hidden] {
            display: none;
        }

        /* The server's status is at the bottom of the side navigation, and
           its items scroll above it */
        cds-side-nav-items {
            margin-bottom: calc(3rem + 1px);
        }




        gs-server-status {
            position: absolute;
            right: 0;
            bottom: 0;
            left: 0;
            border-top: 1px solid var(--cds-border-subtle);
        }

        /* The Volumes page: the volumes, and their state */
        .gf-volumes {
            margin: 0;
            padding: 0;
            list-style: none;
        }

        .gf-volumes li {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem 1rem;
            padding: 0.75rem 0;
            border-bottom: 1px solid var(--cds-border-subtle);
            font-size: 0.875rem;
        }

        .gf-volumes a {
            color: var(--cds-link-primary);
            font-weight: 600;
            text-decoration: none;
        }

        .gf-volumes span {
            flex: 1 1 0;
            min-width: 0;
            color: var(--cds-text-secondary);
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        /* A volume's page: the tree of its folders, beside the folder which
           is chosen, or beneath it, on small screens */
        .gf-volume {
            display: flex;
            flex-wrap: wrap;
            gap: 1.5rem;
            align-items: flex-start;
        }

        .gf-volume-tree {
            flex: 0 1 20rem;
            min-width: 14rem;
            max-width: 100%;
            overflow-x: auto;
            cursor: pointer;
            user-select: none;
        }

        .gf-volume-view {
            flex: 1 1 28rem;
            min-width: 0;
        }

        .gf-empty {
            margin: 0;
            color: var(--cds-text-secondary);
            font-size: 0.875rem;
        }

        .gf-volume-error {
            margin: 0 0 1rem;
            color: var(--cds-text-error);
            font-size: 0.875rem;
        }

        @media (min-width: 66rem) {
            main {
                margin-left: 16rem;
            }
        }
    </style>
</head>

<body class="cds--white">
    <!-- The menu bar, and the sidebar, of the navigation controller, with
         the server's status at its bottom. Each module owns an item in the
         menu bar, and the sidebar while it's active. -->
    <div class="cds--g100">
        <gs-header></gs-header>
        <gs-side-nav>
            <gs-server-status></gs-server-status>
        </gs-side-nav>
    </div>

    <!-- The modules' pages, which they add -->
    <main></main>

    <gs-notifications></gs-notifications>
</body>

</html>
