name: Test

# Pull requests and pushes to main are tested on Linux, macOS and Windows,
# with cgo, which watching files on macOS needs, and with the race detector,
# as each platform watches files its own way. The builds with cgo are of
# go-media's libraries, which make downloads from its release, which
# enriching media needs. The repository is public, so
# the macOS and Windows runners cost no more than Linux's.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A pull request's run is cancelled when it's pushed to again, as only its
# latest commit is merged, but each push to main is tested
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The packages are vetted for each platform, including those which aren't
  # tested, as each has files of its own, such as of watching files, and the
  # client's, without cgo, a job of each, at once. The build with cgo is
  # vetted by its tests, as go test vets what it tests.
  vet:
    name: Vet (${{ matrix.platform }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        platform: [client, linux/amd64, darwin/arm64, windows/amd64, freebsd/amd64]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Vet
        run: make vet-platform PLATFORM=${{ matrix.platform }}

  # The code which is generated from the protocol buffers is committed, so
  # it's generated again, with the versions of protoc and its plugins which
  # generated it, which its headers have, and mustn't change
  protobuf:
    name: Protocol Buffers
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # protoc's version in a header is its release with a major version
      # before it, such as v7.36.2 for 36.2
      - name: Install protoc and its plugins
        run: |
          header=backend/s3/seaweedfs/filer_pb/filer.pb.go
          grpc_header=backend/s3/seaweedfs/filer_pb/filer_grpc.pb.go
          protoc=$(sed -n 's|^//[[:space:]]*protoc[[:space:]]*v[0-9]*\.\([0-9][0-9.]*\)$|\1|p' $header)
          protoc_gen_go=$(sed -n 's|^//[[:space:]]*protoc-gen-go[[:space:]]*\(v[0-9][0-9.]*\)$|\1|p' $header)
          protoc_gen_go_grpc=$(sed -n 's|^//[[:space:]]*-[[:space:]]*protoc-gen-go-grpc[[:space:]]*\(v[0-9][0-9.]*\)$|\1|p' $grpc_header)
          echo "protoc $protoc, protoc-gen-go $protoc_gen_go, protoc-gen-go-grpc $protoc_gen_go_grpc"
          curl -sSfL -o "$RUNNER_TEMP/protoc.zip" "https://github.com/protocolbuffers/protobuf/releases/download/v$protoc/protoc-$protoc-linux-x86_64.zip"
          unzip -q "$RUNNER_TEMP/protoc.zip" -d "$RUNNER_TEMP/protoc"
          echo "$RUNNER_TEMP/protoc/bin" >> "$GITHUB_PATH"
          go install "google.golang.org/protobuf/cmd/protoc-gen-go@$protoc_gen_go"
          go install "google.golang.org/grpc/cmd/protoc-gen-go-grpc@$protoc_gen_go_grpc"
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Generate
        run: make protobuf-generate

      - name: Check the generated code is committed
        run: |
          git diff --exit-code || (echo "The generated code isn't the same as what's committed, so run make protobuf-generate" && exit 1)

  # Its name has no matrix in it, as GitHub adds the OS to it when it runs
  test:
    name: Test
    runs-on: ${{ matrix.os }}
    strategy:
      # Report results for every platform, even if one fails
      fail-fast: false
      # Only Linux, for now, as macOS and Windows runners are slow, and
      # their builds, with cgo and without, are known to work. Add
      # macos-latest and windows-latest back to test them again, whose
      # steps are kept.
      matrix:
        os: [ubuntu-latest]
    steps:
      - name: Configure git line endings
        shell: bash
        run: git config --global core.autocrlf input

      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # make, and gcc and pkg-config for cgo and the race detector, curl and
      # unzip, which download go-media's libraries, and the libraries they
      # link with, as go-media's own tests install. Keeps the Go
      # toolchain, which is installed outside MSYS2, visible in the msys2
      # shell.
      - name: Setup MSYS2 (Windows)
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          path-type: inherit
          install: make curl unzip mingw-w64-x86_64-toolchain mingw-w64-x86_64-pkgconf mingw-w64-x86_64-zlib mingw-w64-x86_64-libde265 mingw-w64-x86_64-aom mingw-w64-x86_64-dav1d mingw-w64-x86_64-bzip2 mingw-w64-x86_64-xz mingw-w64-x86_64-openssl mingw-w64-x86_64-libxml2 mingw-w64-x86_64-zstd

      # The libraries which go-media's link with, on Linux, which its
      # etc/docker/packages.sh lists, of the LGPL build
      - name: Install go-media's dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get -y update && sudo apt-get -y install --no-install-recommends pkg-config libde265-dev libaom-dev libdav1d-dev libxml2-dev liblzma-dev zlib1g-dev libssl-dev libzstd-dev

      # go-media's libraries, of its release, which link Homebrew's packages
      # on macOS, which its Brewfile lists
      - name: Download go-media's libraries (macOS)
        if: runner.os == 'macOS'
        run: |
          make go-media
          brew bundle --file build/go-media/Brewfile

      # The tests are run once, with the race detector, which tests as much
      # as they do without it
      - name: Race Test
        if: runner.os != 'Windows'
        run: make race-test

      - name: Race Test (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: make race-test

  # The web UI is type checked, tested and built, with @mutablelogic packages
  # from GitHub Packages, which the workflow's token can read
  frontend:
    name: Test frontend
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "24.x"

      - name: Test and build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          make frontend-test
          make frontend
